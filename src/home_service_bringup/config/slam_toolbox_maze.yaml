# =====================================================================
#  slam_toolbox (async, modo mapping) — Reto 4: LABERINTO
# ---------------------------------------------------------------------
#  POR QUE SLAM Y NO AMCL + MAPA GUARDADO
#  ======================================
#  El sintoma reportado era: "al girar, el mapa guardado se desfasa del
#  mapa en tiempo real". Eso es AMCL perdiendo la pose durante el giro.
#  Con un robot mecanum el deslizamiento en rotacion es grande y el
#  modelo de movimiento de AMCL (alpha1..alpha5 = 0.2) lo infravalora
#  muchisimo, ademas de que solo se actualizaba cada 0.2 rad (11.5 deg).
#
#  slam_toolbox corrige la pose por SCAN MATCHING contra el mapa que el
#  mismo construye, asi que el mapa y el laser NUNCA se desfasan por
#  definicion: son la misma fuente. Ademas actualiza cada 0.087 rad
#  (5 deg), es decir mas de dos veces mas fino que AMCL.
#
#  Consume /scan_filtered (salida del scan_sanitizer), no /scan.
# =====================================================================

slam_toolbox:
  ros__parameters:

    # --- Plugins del solver ---
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # --- Frames y topics ---
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan_filtered
    use_map_saver: true
    mode: mapping

    debug_logging: false
    throttle_scans: 1

    # 50 Hz de publicacion de map->odom: la correccion llega antes de
    # que los costmaps usen una TF vieja.
    transform_publish_period: 0.02
    # 1 s (por defecto 5 s): el costmap global ve el mapa fresco mucho
    # antes, lo que evita planificar sobre geometria caduca.
    map_update_interval: 1.0

    resolution: 0.05
    # El laberinto mide 4.5 x 3.0 m (diagonal 5.4 m). Limitar a 5.0 m
    # descarta retornos rasantes y ruidosos.
    max_laser_range: 5.0
    minimum_time_interval: 0.2
    transform_timeout: 0.2
    tf_buffer_duration: 10.0
    stack_size_to_use: 40000000

    # --- Frecuencia de actualizacion del grafo ---
    # CLAVE PARA EL PROBLEMA DEL GIRO:
    # 0.10 m / 0.087 rad (5 deg) fuerza a insertar un scan nuevo muy a
    # menudo. Durante una rotacion se corrige la pose continuamente en
    # vez de acumular deriva hasta el siguiente umbral.
    minimum_travel_distance: 0.10
    minimum_travel_heading: 0.087

    # --- Emparejado de scans ---
    use_scan_matching: true
    use_scan_barycenter: true
    scan_buffer_size: 20
    scan_buffer_maximum_scan_distance: 6.0
    link_match_minimum_response_fine: 0.12
    link_scan_maximum_distance: 1.5

    # --- Cierre de bucle ---
    do_loop_closing: true
    loop_search_maximum_distance: 2.5
    loop_match_minimum_chain_size: 8
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # --- Correlacion (busqueda fina) ---
    # Espacio de busqueda amplio (0.5 m) para poder absorber el salto de
    # odometria que produce el deslizamiento mecanum en los giros.
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # --- Correlacion para cierre de bucle ---
    loop_search_space_dimension: 6.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # --- Penalizaciones del scan matcher ---
    # Penalizacion angular baja (0.9): se le da MENOS credibilidad a la
    # odometria angular, que es justo la poco fiable en mecanum.
    distance_variance_penalty: 0.5
    angle_variance_penalty: 0.9
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
