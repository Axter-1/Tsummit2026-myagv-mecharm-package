# =====================================================================
#  Nav2 — Reto 4: LABERINTO (robot real, myAGV mecanum + MechArm 270)
# ---------------------------------------------------------------------
#  Geometria de referencia (PDF "T-SUMMIT-Challenge pista y retos"):
#     zona          4.5 m x 3.0 m
#     pasillo       0.60 m  (critico)
#     grosor muro   0.12 m
#     tramos muro   1.5 / 1.2 / 1.0 m
#
#  Geometria real del robot (model_builder.py):
#     largo  0.33115 m      ancho  0.230 m
#     base_link desplazado +0.007 m respecto al centro de ruedas
#
#  DECISIONES CLAVE Y POR QUE
#  ==========================
#  1) FOOTPRINT POLIGONAL en vez de robot_radius.
#     robot_radius: 0.18 modelaba el robot como un circulo de 36 cm de
#     diametro. El radio inscrito real es 0.115 m (medio ancho). Usar el
#     poligono devuelve ~6.5 cm de holgura POR LADO en un pasillo de
#     60 cm. Es la diferencia entre "cabe" y "no cabe".
#
#  2) inflation_radius 0.55 -> 0.20 (global) / 0.16 (local).
#     Con 0.55 m de inflado desde CADA muro, un pasillo de 0.60 m queda
#     inflado al 100%: no existe ninguna celda de coste bajo y el
#     controlador se queda colgado. Ese era el problema reportado.
#     Con 0.20 m queda una banda central libre de 0.20 m
#     (0.60 - 2*0.20) por la que el planificador puede trazar.
#
#  3) obstacle/raytrace ranges recortados al tamano del escenario.
#     Estaban en 7.5 / 8.0 m sobre un laberinto cuya diagonal es 5.4 m.
#     Marcar a 7.5 m estampa retornos rasantes y ruidosos como muros.
#     raytrace_max_range SIEMPRE > obstacle_max_range para que se pueda
#     limpiar mas lejos de lo que se marca.
#
#  4) VoxelLayer -> ObstacleLayer en el costmap local.
#     El X2L es un laser 2D: los voxeles solo gastan CPU de la Nano.
#
#  5) DWB sin criticos de alineacion (PathAlign / GoalAlign).
#     El myAGV es holonomico. Los criticos "Align" fuerzan a orientar el
#     morro hacia el camino, lo que obliga a GIRAR en cada esquina. El
#     giro es justo lo que descuadra la odometria mecanum y genera las
#     paredes fantasma. Sin ellos el robot ATRAVIESA el laberinto
#     desplazandose en X e Y casi sin rotar.
#
#  6) yaw_goal_tolerance = 3.14 -> no hay giro final en el FINISH.
#     El reto solo pide llegar, no una orientacion concreta.
#
#  7) Todos los costmaps escuchan /scan_filtered (scan_sanitizer), no
#     /scan. Ver home_service_navigation/scan_sanitizer_node.py.
# =====================================================================

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # default_nav_to_pose_bt_xml lo inyecta nav2_core.launch.py con la
    # ruta absoluta de config/bt_maze_no_spin.xml (arbol SIN la
    # recuperacion "Spin": girar sobre si mismo es contraproducente en
    # este robot y en pasillos de 60 cm).
    transform_tolerance: 0.3
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_smooth_path_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_assisted_teleop_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_drive_on_heading_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_globally_updated_goal_condition_bt_node
    - nav2_is_path_valid_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_truncate_path_local_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_path_expiring_timer_condition
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_goal_updated_controller_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node
    - nav2_controller_cancel_bt_node
    - nav2_path_longer_on_approach_bt_node
    - nav2_wait_cancel_bt_node
    - nav2_spin_cancel_bt_node
    - nav2_back_up_cancel_bt_node
    - nav2_assisted_teleop_cancel_bt_node
    - nav2_drive_on_heading_cancel_bt_node
    - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

# ---------------------------------------------------------------------
#  CONTROLADOR — DWB holonomico
# ---------------------------------------------------------------------
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.04
      movement_time_allowance: 15.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      # 3.14 = cualquier orientacion vale -> el robot NO gira al llegar.
      yaw_goal_tolerance: 3.14

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false

      # --- Limites de velocidad (mecanum) ---
      min_vel_x: -0.10
      max_vel_x: 0.18
      # LA PLACA SE QUEDA A CERO CON LOS TRES EJES NO NULOS
      #
      # Medido en el robot, ventanas de 2 s sobre /odom (la tabla
      # completa esta en approach_planner.holonomic_command):
      #
      #     avance + giro      0.302 m / 0.273 rad
      #     lateral + giro     0.217 m / 0.277 rad
      #     avance + lateral   0.271 m
      #     LOS TRES           0.000 m / 0.000 rad   <-- ni un mm
      #
      # No es saturacion: a cualquier magnitud da cero. Y DWB muestrea
      # los tres ejes a la vez, asi que ordenaba combinaciones que la
      # base NO EJECUTA. El robot hacia un subconjunto del plan mientras
      # el controlador creia estar describiendo la curva completa: de
      # ahi que acabara donde no tocaba, contra paredes que el LiDAR
      # veia perfectamente.
      #
      # La aproximacion por ArUco resuelve esto multiplexando (ciclo de
      # giro puro o de traslacion pura). Nav2 no tiene nada equivalente
      # y entre el y la base solo hay un twist_mux, que selecciona pero
      # no modifica. Asi que aqui se renuncia al eje lateral y el
      # laberinto se navega como un diferencial: vx + wz, dos ejes, que
      # la base si ejecuta.
      #
      # Se pierde la correccion lateral sin rotar. A cambio, el robot
      # hace lo que se le manda, que en un pasillo de 60 cm importa
      # bastante mas.
      min_vel_y: 0.0
      max_vel_y: 0.0
      min_vel_theta: -0.40
      max_vel_theta: 0.40
      min_speed_xy: 0.0
      max_speed_xy: 0.20
      min_speed_theta: 0.0

      acc_lim_x: 0.40
      acc_lim_y: 0.40
      acc_lim_theta: 1.00
      decel_lim_x: -0.40
      decel_lim_y: -0.40
      decel_lim_theta: -1.00

      # --- Muestreo ---
      # vy_samples > 0 habilita el desplazamiento lateral: es lo que
      # permite corregir dentro del pasillo sin rotar.
      vx_samples: 12
      # 1 unica muestra y el rango de vy clavado a cero: nunca sale una
      # trayectoria con los tres ejes activos.
      vy_samples: 1
      vtheta_samples: 10

      # 1.4 s a 0.18 m/s mira ~25 cm adelante: suficiente en un
      # laberinto y evita descartar todas las trayectorias por colision
      # (con 1.7 s en pasillos de 60 cm casi todas chocan).
      sim_time: 1.4
      linear_granularity: 0.03
      angular_granularity: 0.025
      transform_tolerance: 0.3
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.01
      short_circuit_trajectory_evaluation: true
      stateful: true

      # --- Criticos ---
      # SIN PathAlign ni GoalAlign: son los que fuerzan a girar el morro.
      # ObstacleFootprint, NO BaseObstacle
      #
      # BaseObstacleCritic puntua con el coste de UNA celda: la del
      # centro del robot. El cuerpo puede solaparse con la pared
      # mientras el centro este en celda no letal, y la unica
      # proteccion que quedaba era la inflacion: 0.16 contra un radio
      # inscrito de 0.130, o sea 3 cm para absorber deriva de AMCL,
      # ruido del X2 y latencia.
      #
      # Y con BaseObstacle.scale 0.05 contra PathDist 34.0, ese coste
      # pesaba 1 parte entre 680: seguir el camino ganaba siempre.
      #
      # ObstacleFootprintCritic comprueba el POLIGONO completo y
      # descarta la trayectoria si colisiona, en vez de puntuarla bajo.
      # Es la diferencia entre "esta trayectoria es peor" y "esta
      # trayectoria es imposible".
      #
      # CUESTA CPU: comprueba el poligono en cada pose de cada
      # trayectoria. Con sim_time 1.4 y granularidad 0.03 son ~47 poses
      # por trayectoria y 120 trayectorias (12 x 1 x 10). En la Nano eso
      # se nota. short_circuit_trajectory_evaluation ya esta en true, que
      # es lo que lo hace viable. SI el controlador no llega a su
      # frecuencia, baja vx_samples a 8 y vtheta_samples a 8 antes de
      # tocar nada mas: se ve en
      #   ros2 topic hz /local_plan
      critics: ["Oscillation", "ObstacleFootprint", "PathDist", "GoalDist", "RotateToGoal"]
      ObstacleFootprint.scale: 0.5
      ObstacleFootprint.sum_scores: false
      PathDist.scale: 34.0
      GoalDist.scale: 20.0
      # Peso bajo: solo actua en el tramo final y con tolerancia 3.14
      # practicamente nunca llega a girar.
      RotateToGoal.scale: 6.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      Oscillation.scale: 1.0
      Oscillation.oscillation_reset_dist: 0.10
      Oscillation.oscillation_reset_angle: 0.30
      Oscillation.oscillation_reset_time: 5.0
      Oscillation.x_only_threshold: 0.05

# ---------------------------------------------------------------------
#  COSTMAP LOCAL
# ---------------------------------------------------------------------
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      transform_tolerance: 0.3

      # Poligono del myAGV (base_footprint) con ~1.5 cm de margen.
      #
      # MEDIDO, no heredado. El 0.188 anterior ponia el morro 4.3 cm por
      # delante de donde esta. Cadena: TF base_footprint -> laser_frame
      # da x=0.065; measure_front_offset.py contra pared plana da 0.080
      # de salida del rayo -> morro en 0.145. Con el margen, 0.160.
      # Trasera: 0.145 - 0.330 de largo = -0.185, con margen -0.200.
      #
      # Importa mas que antes: ObstacleFootprint comprueba ESTE poligono
      # pose a pose, asi que un footprint mal medido ya no solo infla de
      # mas, decide colisiones.
      #
      # Radio inscrito: 0.130 m (la semianchura, SIN verificar).
      footprint: "[[0.160, 0.130], [0.160, -0.130], [-0.200, -0.130], [-0.200, 0.130]]"
      footprint_padding: 0.0

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_filtered
          data_type: "LaserScan"
          marking: true
          clearing: true
          # 0.0 = cada scan sustituye al anterior. Cualquier valor > 0
          # hace que los obstaculos PERSISTAN: fuente de fantasmas.
          observation_persistence: 0.0
          expected_update_rate: 0.0
          min_obstacle_height: -1.0
          max_obstacle_height: 2.0
          obstacle_max_range: 2.0
          obstacle_min_range: 0.16
          # Siempre mayor que obstacle_max_range.
          raytrace_max_range: 2.5
          raytrace_min_range: 0.16
          inf_is_valid: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        # 0.16 deja 0.28 m libres en el centro del pasillo: margen para
        # que el controlador maniobre sin quedarse colgado.
        inflation_radius: 0.16
        cost_scaling_factor: 6.0
        inflate_unknown: false
        inflate_around_unknown: false

      always_send_full_costmap: true

# ---------------------------------------------------------------------
#  COSTMAP GLOBAL
# ---------------------------------------------------------------------
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      # 2.0 Hz (antes 1.0): los fantasmas se limpian el doble de rapido.
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      transform_tolerance: 0.3

      # Imprescindible con SLAM en vivo: lo no explorado es DESCONOCIDO,
      # no libre ni ocupado. El planificador lo cruza con allow_unknown.
      track_unknown_space: true

      footprint: "[[0.160, 0.130], [0.160, -0.130], [-0.200, -0.130], [-0.200, 0.130]]"
      footprint_padding: 0.0

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_filtered
          data_type: "LaserScan"
          marking: true
          clearing: true
          observation_persistence: 0.0
          expected_update_rate: 0.0
          min_obstacle_height: -1.0
          max_obstacle_height: 2.0
          # Solo se marca lo cercano y bien observado.
          obstacle_max_range: 2.5
          obstacle_min_range: 0.16
          raytrace_max_range: 3.0
          raytrace_min_range: 0.16
          inf_is_valid: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        # 0.20 -> banda central libre de 0.20 m en un pasillo de 0.60 m.
        inflation_radius: 0.20
        cost_scaling_factor: 3.0
        inflate_unknown: false
        inflate_around_unknown: false

      always_send_full_costmap: true

# ---------------------------------------------------------------------
#  PLANIFICADOR
# ---------------------------------------------------------------------
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      # Dijkstra: mas lento que A* pero encuentra el optimo global, que
      # es lo que interesa en un laberinto con callejon sin salida.
      use_astar: false
      # CRITICO con SLAM en vivo: permite planificar hacia zonas del
      # laberinto todavia no exploradas.
      allow_unknown: true
      tolerance: 0.25

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

# ---------------------------------------------------------------------
#  COMPORTAMIENTOS DE RECUPERACION
# ---------------------------------------------------------------------
behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    simulate_ahead_time: 1.5
    # 'spin' queda declarado por compatibilidad, pero el arbol de
    # comportamiento bt_maze_no_spin.xml NO lo invoca.
    max_rotational_vel: 0.4
    min_rotational_vel: 0.15
    rotational_acc_lim: 1.0

# ---------------------------------------------------------------------
#  SUAVIZADOR DE VELOCIDAD
# ---------------------------------------------------------------------
#  Entrada  : cmd_vel_raw   (del controller_server)
#  Salida   : cmd_vel_nav   (entrada de twist_mux)
#  El remapeo se hace en nav2_core.launch.py.
# ---------------------------------------------------------------------
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.18, 0.14, 0.40]
    min_velocity: [-0.10, -0.14, -0.40]
    max_accel: [0.40, 0.40, 1.00]
    max_decel: [-0.40, -0.40, -1.00]
    odom_topic: "/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# ---------------------------------------------------------------------
#  LOCALIZACION ALTERNATIVA (solo con slam:=false y un mapa guardado)
# ---------------------------------------------------------------------
#  El modo por defecto del laberinto es SLAM en vivo (slam_toolbox), que
#  elimina de raiz el desfase "mapa guardado vs mapa en tiempo real".
#  Esta seccion queda para el modo AMCL, ya corregida.
# ---------------------------------------------------------------------
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan_filtered
    # Correcto para mecanum (holonomico).
    robot_model_type: "nav2_amcl::OmniMotionModel"

    # --- PROBLEMA "AMCL se actualiza lento" ---
    # Antes: 0.25 m / 0.20 rad (11.5 deg). El robot podia girar 11 grados
    # completos antes de que AMCL corrigiera nada; en ese hueco los
    # costmaps marcaban con una pose ya caduca -> paredes fantasma.
    update_min_d: 0.10
    update_min_a: 0.05

    # --- Ruido del modelo de movimiento ---
    # Todos estaban a 0.2. En mecanum el giro desliza mucho: hay que
    # declarar mas incertidumbre en las componentes que dependen de la
    # rotacion, o el filtro confia de mas en la odometria.
    alpha1: 0.8
    alpha2: 0.4
    alpha3: 0.4
    alpha4: 0.6
    alpha5: 0.3

    # --- Carga computacional en la Jetson Nano ---
    # 500..2000 particulas eran demasiadas para 4.5 x 3.0 m.
    min_particles: 400
    max_particles: 1500

    laser_model_type: "likelihood_field"
    laser_max_range: 5.0
    laser_min_range: 0.16
    max_beams: 120
    sigma_hit: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3

    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1

    # Recuperacion activada (antes 0.0 = desactivada): permite que el
    # filtro se re-localice solo si el giro le hizo perder la pose.
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1

    # 1.0 s enmascaraba TF caducada y dejaba usar poses viejas.
    transform_tolerance: 0.3
    save_pose_rate: 0.5
    tf_broadcast: true
    set_initial_pose: false
    always_reset_initial_pose: false
