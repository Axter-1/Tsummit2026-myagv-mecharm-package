# =====================================================================
#  RETO 1 — ZONA DE CLASIFICACION, POR PASOS  (caso KOSTAL)
# ---------------------------------------------------------------------
#  Secuencia OBLIGATORIA del reglamento (Indicaciones tecnicas,
#  Cuadrante 1):
#
#      START -> Verde 0 -> Verde 2 -> Azul 1 -> Azul 3 -> FINISH
#
#  Esta rutina la cumple, pero pasando por waypoints intermedios para
#  que la navegacion no tenga que resolver el cruce de la pista en un
#  solo goal:
#
#      START -> Verde 0 -> Posicion 2 -> Verde 2 -> Posicion 1
#            -> Azul 1  -> Posicion 2 -> Azul 3   -> FINISH
#
#  Los waypoints NO alteran el orden de recogida y entrega, que es lo
#  unico que el reglamento fija.
#
#  DE DONDE SALEN LAS COORDENADAS
#  ==============================
#  De <mapa>.poses.yaml, el fichero que escribe 'tsummit.sh save-pose'
#  durante el mapeo. Aqui no hay ni un numero de pista: los pasos piden
#  posiciones POR NOMBRE y el mission_manager las resuelve contra el
#  mapa cargado. Si falta alguna, la mision no arranca -- avisa antes de
#  mover el robot, no a mitad de rutina con una pieza en la pinza.
#
#  Posiciones que hay que guardar (con ese nombre exacto):
#
#      start        el origen, area de START
#      carga_0      cerca del ArUco 0, mirandolo
#      posicion_2   waypoint de paso hacia la zona de entrega
#      entrega_2    cerca del ArUco 2, mirandolo
#      posicion_1   waypoint de paso hacia la zona de carga
#      carga_1      cerca del ArUco 1, mirandolo
#      entrega_3    cerca del ArUco 3, mirandolo
#      finish       area de FINISH
#
#  Los 'navigate' solo tienen que dejar al robot CERCA y mirando hacia
#  el marcador: el encare fino lo hace la aproximacion ArUco, que va
#  dentro del propio paso 'grasp'.
#
#  POR QUE NO HAY PASOS 'aruco'
#  ============================
#  Porque el paso 'grasp' ya los lleva dentro. object_grasp_server hace
#  su propia aproximacion (/aruco_lidar_approach) antes de bajar el
#  brazo. Meter aqui un paso 'aruco' aparte haria la aproximacion DOS
#  veces, y la segunda partiria de una pose que la primera ya dejo en
#  tolerancia.
#
#  ANTES DE CORRER ESTO
#  ====================
#  1) Mapa y posiciones guardadas (ver arriba).
#  2) Calibracion de PICK y de PLACE para las dos piezas a la altura de
#     plataforma que se vaya a usar:
#         ./scripts/tsummit.sh calibrate-grasp <pieza> 100 --action pick
#         ./scripts/tsummit.sh calibrate-grasp <pieza> 100 --action place
#     Sin la de place, el paso de entrega aborta con INVALID_GOAL: el
#     servidor NO deduce el soltado a partir del agarre.
#  3) La pila preparada, con la MISMA altura de plataforma:
#         DISTRIBUTED=1 LAPTOP_IP=<ip> \
#             ./scripts/tsummit.sh prepare grasp <pieza> --table-height 100
# =====================================================================

mission:

  name: reto1_pasos

  # Mapa al que se atan las posiciones. Explicito a proposito: con esto
  # vacio se cogeria el <mapa>.poses.yaml mas reciente de maps/, y
  # cargar en silencio las posiciones de otro mapa manda al robot a
  # coordenadas que no existen.
  #
  # OJO AL NOMBRE: las posiciones de ejemplo del reto 1 se guardaron
  # contra 'maze-map', que es como se llamaba el mapa vivo en ese
  # momento. El nombre es el del MAPA, no el del reto. Cuando se mapee
  # la pista buena, cambia esto al nombre nuevo y vuelve a guardar las
  # ocho posiciones: las coordenadas no se pueden reutilizar entre
  # mapas.
  #
  # Guardado hoy en maps/maze-map.poses.yaml:  start
  # Faltan:  carga_0, posicion_2, entrega_2, posicion_1, carga_1,
  #          entrega_3, finish
  map: "maze-map"

  repeat: 1

  # El reto penaliza los errores de secuencia. Si algo falla de verdad
  # es preferible parar a seguir colocando piezas donde no toca.
  stop_on_failure: true

  steps:

    # =================================================================
    # PREPARACION
    # =================================================================

    - type: arm_pose
      name: plegar_brazo_para_navegar
      pose: home
      speed_percent: 30.0
      retries: 1

    # =================================================================
    # PIEZA VERDE:  ArUco 0  ->  ArUco 2
    # =================================================================

    - type: navigate
      name: ir_a_carga_verde
      pose: carga_0
      frame_id: map
      retries: 2

    - type: grasp
      name: tomar_pieza_verde
      action: pick
      # OJO: nombre de la PIEZA del catalogo, no 'auto'.
      #
      # 'auto' identificaria la pieza por el ArUco que vea, y en este
      # reto los ArUco 0..3 son UBICACIONES (carga verde, carga azul,
      # entrega verde, entrega azul), no piezas. El aruco_to_object del
      # catalogo mapea 1->engranaje, 2->poste, 3->rueda, que es una
      # asignacion distinta y hoy provisional. Con 'auto', el robot
      # creeria que en la entrega verde (ArUco 2) hay un poste.
      object: rueda           # TODO: la pieza VERDE real
      retreat_pose: carry
      speed_percent: 25.0
      gripper_speed_percent: 40.0
      retries: 1

    - type: navigate
      name: cruzar_a_entrega
      pose: posicion_2
      frame_id: map
      retries: 2

    - type: navigate
      name: ir_a_entrega_verde
      pose: entrega_2
      frame_id: map
      retries: 2

    - type: grasp
      name: soltar_pieza_verde
      action: place
      object: rueda           # TODO: la misma pieza VERDE
      retreat_pose: home
      speed_percent: 25.0
      gripper_speed_percent: 40.0
      retries: 1

    # =================================================================
    # PIEZA AZUL:  ArUco 1  ->  ArUco 3
    # =================================================================

    - type: navigate
      name: volver_a_zona_de_carga
      pose: posicion_1
      frame_id: map
      retries: 2

    - type: navigate
      name: ir_a_carga_azul
      pose: carga_1
      frame_id: map
      retries: 2

    - type: grasp
      name: tomar_pieza_azul
      action: pick
      object: estrella        # TODO: la pieza AZUL real
      retreat_pose: carry
      speed_percent: 25.0
      gripper_speed_percent: 40.0
      retries: 1

    - type: navigate
      name: cruzar_a_entrega_azul
      pose: posicion_2
      frame_id: map
      retries: 2

    - type: navigate
      name: ir_a_entrega_azul
      pose: entrega_3
      frame_id: map
      retries: 2

    - type: grasp
      name: soltar_pieza_azul
      action: place
      object: estrella        # TODO: la misma pieza AZUL
      retreat_pose: home
      speed_percent: 25.0
      gripper_speed_percent: 40.0
      retries: 1

    # =================================================================
    # FINISH
    # =================================================================

    - type: arm_pose
      name: plegar_brazo_final
      pose: home
      speed_percent: 30.0
      retries: 1

    - type: navigate
      name: estacionar_en_finish
      pose: finish
      frame_id: map
      retries: 2
