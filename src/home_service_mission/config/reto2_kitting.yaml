# =====================================================================
#  RETO 2 — ZONA DE KITTING  (caso de industria: DENSO)
# ---------------------------------------------------------------------
#  Misma secuencia obligatoria que el Reto 1:
#     START -> Verde ArUco 0 -> ArUco 2 -> Azul ArUco 1 -> ArUco 3 -> FINISH
#
#  LA DIFERENCIA ES LA "LOGICA DE FALLO" (keep-it-simple)
#  ======================================================
#  Cita de las indicaciones tecnicas:
#
#     "la vision artificial busca la pieza, pero si no la encuentra,
#      no debe congelarse. Implementacion de un Timeout de Deteccion
#      de 10 segundos. Si falla, debe escribir en el log
#      'Pieza Omitida' y continuar con la siguiente coordenada."
#
#  Como se implementa aqui:
#     timeout_sec: 10.0      -> el paso ArUco se rinde a los 10 s
#     on_failure: skip       -> no aborta la mision, pasa al siguiente
#     skip_message: "Pieza Omitida"  -> texto exacto en el log
#
#  stop_on_failure sigue en true para que un fallo NO previsto (por
#  ejemplo el brazo desconectado) si detenga la mision; son los pasos
#  individuales los que declaran que se pueden omitir.
#
#  La preparacion (poses del brazo y coordenadas) es identica a la del
#  Reto 1: ver reto1_clasificacion.yaml.
# =====================================================================

mission:

  name: reto2_kitting

  repeat: 1
  stop_on_failure: true

  steps:

    - type: arm_pose
      name: plegar_brazo_para_navegar
      pose: home
      speed_percent: 30.0
      retries: 1

    # =================================================================
    # PIEZA VERDE:  ArUco 0  ->  ArUco 2
    # =================================================================

    - type: navigate
      name: ir_a_carga_verde
      x: 0.80          # TODO: medir en pista
      y: 0.00          # TODO
      yaw_deg: 0.0     # TODO
      frame_id: map
      retries: 2

    - type: aruco
      name: aproximar_aruco_0
      id: 0
      stop_distance: 0.18
      # Timeout de deteccion exigido por el reto.
      timeout_sec: 10.0
      retries: 0
      on_failure: skip
      skip_message: "Pieza Omitida"

    - type: arm_pose
      name: observar_pieza_verde
      pose: observe
      speed_percent: 30.0
      retries: 1
      on_failure: skip
      skip_message: "Pieza Omitida"

    - type: pick
      name: tomar_pieza_verde
      target_pose: pick_table
      approach_height: 70.0
      retreat_pose: carry
      speed_percent: 25.0
      gripper_speed_percent: 40.0
      retries: 0
      on_failure: skip
      skip_message: "Pieza Omitida"

    - type: navigate
      name: ir_a_entrega_verde
      x: 1.60          # TODO
      y: 0.00          # TODO
      yaw_deg: 0.0     # TODO
      frame_id: map
      retries: 2

    - type: aruco
      name: aproximar_aruco_2
      id: 2
      stop_distance: 0.18
      timeout_sec: 10.0
      retries: 0
      on_failure: skip
      skip_message: "Pieza Omitida"

    - type: place
      name: soltar_pieza_verde
      target_pose: place_table
      approach_height: 70.0
      retreat_pose: home
      speed_percent: 25.0
      gripper_speed_percent: 40.0
      retries: 0
      on_failure: skip
      skip_message: "Pieza Omitida"

    # =================================================================
    # PIEZA AZUL:  ArUco 1  ->  ArUco 3
    # =================================================================

    - type: navigate
      name: volver_a_carga_azul
      x: 0.80          # TODO
      y: 0.50          # TODO
      yaw_deg: 0.0     # TODO
      frame_id: map
      retries: 2

    - type: aruco
      name: aproximar_aruco_1
      id: 1
      stop_distance: 0.18
      timeout_sec: 10.0
      retries: 0
      on_failure: skip
      skip_message: "Pieza Omitida"

    - type: arm_pose
      name: observar_pieza_azul
      pose: observe
      speed_percent: 30.0
      retries: 1
      on_failure: skip
      skip_message: "Pieza Omitida"

    - type: pick
      name: tomar_pieza_azul
      target_pose: pick_table
      approach_height: 70.0
      retreat_pose: carry
      speed_percent: 25.0
      gripper_speed_percent: 40.0
      retries: 0
      on_failure: skip
      skip_message: "Pieza Omitida"

    - type: navigate
      name: ir_a_entrega_azul
      x: 1.60          # TODO
      y: 0.50          # TODO
      yaw_deg: 0.0     # TODO
      frame_id: map
      retries: 2

    - type: aruco
      name: aproximar_aruco_3
      id: 3
      stop_distance: 0.18
      timeout_sec: 10.0
      retries: 0
      on_failure: skip
      skip_message: "Pieza Omitida"

    - type: place
      name: soltar_pieza_azul
      target_pose: place_table
      approach_height: 70.0
      retreat_pose: home
      speed_percent: 25.0
      gripper_speed_percent: 40.0
      retries: 0
      on_failure: skip
      skip_message: "Pieza Omitida"

    # =================================================================
    # FINISH
    # =================================================================

    - type: arm_pose
      name: plegar_brazo_final
      pose: home
      speed_percent: 30.0
      retries: 1

    - type: navigate
      name: estacionar_en_finish
      x: 0.00          # TODO
      y: 0.00          # TODO
      yaw_deg: 0.0     # TODO
      frame_id: map
      retries: 2
