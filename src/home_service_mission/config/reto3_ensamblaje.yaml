# =====================================================================
#  RETO 3 — ZONA DE ENSAMBLAJE  (MICHELIN)
#  Numeracion segun "Indicaciones tecnicas T-SUMMIT Challenge"
# ---------------------------------------------------------------------
#  Del reglamento: "Tomaran las piezas del ArUco 0 al 2, en ese orden".
#  Las tres se apilan concentricamente sobre el poste de la base de
#  montaje. El reglamento NO asigna un ArUco a la base.
#
#  IDA Y VUELTA POR PIEZA: el MechArm lleva una sola pieza a la vez,
#  asi que son tres viajes estacion -> montaje, no una recogida
#  masiva. Si en pista se ve que puede cargar varias, se reordena
#  aqui sin tocar codigo.
#
#  LOS ArUco MARCAN UBICACIONES, NO PIEZAS
#  =======================================
#  Es lo unico que el reglamento fija, y hay que tenerlo claro porque
#  grasp_catalog.yaml tiene ADEMAS un `aruco_to_object` provisional
#  (1->engranaje, 2->poste, 3->rueda) que es otra cosa. Con
#  `object: auto`, en la entrega (ArUco 2) el robot creeria que hay un
#  poste. Por eso los pasos nombran la pieza explicitamente, via
#  variable.
#
#  QUE PIEZA HAY EN CADA SITIO NO SE SABE HASTA LA PISTA
#  ====================================================
#  Por eso van como variables y no como literales. Se sobrescriben sin
#  tocar el fichero:
#
#      ./scripts/tsummit.sh reto3 --pieza-verde poste --pieza-azul rueda
#
#  POSICIONES
#  ==========
#  Salen de <mapa>.poses.yaml, que escribe `tsummit.sh save-pose`
#  durante el mapeo. Aqui no hay ni una coordenada. Si falta alguna, la
#  mision NO arranca -- avisa antes de mover el robot, no a mitad de
#  rutina con una pieza en la pinza.
#
#  Posiciones necesarias (con estos nombres exactos):
#      start        el origen, area de START
#      estacion_0   frente al ArUco 0 (primera pieza)
#      estacion_1   frente al ArUco 1 (segunda pieza)
#      estacion_2   frente al ArUco 2 (tercera pieza)
#      montaje      frente a la base de montaje, con el poste
#      finish       area de FINISH
#
#  Los `navigate` solo tienen que dejar al robot CERCA y mirando al
#  marcador: el encare fino lo hace la aproximacion ArUco, que va DENTRO
#  del paso `grasp`. Por eso no hay pasos `aruco` sueltos: meterlos
#  haria la aproximacion dos veces.
#
#  ANTES DE CORRER ESTO
#  ====================
#  1) Mapa y posiciones guardadas.
#  2) Calibracion de pick Y de place para cada pieza, a la altura de
#     plataforma que se use:
#         ./scripts/tsummit.sh calibrate-grasp <pieza> 100 --action pick
#         ./scripts/tsummit.sh calibrate-grasp <pieza> 100 --action place
#     Sin la de place el paso de entrega aborta con INVALID_GOAL: el
#     servidor NO deduce el soltado a partir del agarre.
#  3) La pila preparada, con la MISMA altura de plataforma.
# =====================================================================

mission:

  name: reto3_ensamblaje

  # Mapa al que se atan las posiciones. Explicito a proposito: vacio
  # cogeria el <mapa>.poses.yaml mas reciente, y cargar en silencio las
  # posiciones de otro mapa manda al robot a coordenadas que no existen.
  map: "maze-map"

  vars:
    # Las tres piezas apilables, en el orden ArUco 0, 1, 2.
    pieza_0: "rueda"
    pieza_1: "engranaje"
    pieza_2: "estrella"

  repeat: 1

  # El reto penaliza los errores de secuencia. Si algo falla de verdad
  # es preferible parar a seguir colocando piezas donde no toca.
  stop_on_failure: true

  steps:

    - type: arm_pose
      name: plegar_brazo_para_navegar
      pose: home
      speed_percent: 30.0
      retries: 1

    # ============ PIEZA 1: ArUco 0 -> base de montaje ===========

    - type: navigate
      name: ir_a_estacion_0
      pose: estacion_0
      frame_id: map
      retries: 2

    - type: grasp
      name: tomar_pieza_0
      action: pick
      object: "${pieza_0}"
      retreat_pose: carry
      speed_percent: 25.0
      gripper_speed_percent: 40.0
      retries: 1

    - type: navigate
      name: ir_a_montaje_0
      pose: montaje
      frame_id: map
      retries: 2

    - type: grasp
      name: apilar_pieza_0
      action: place
      object: "${pieza_0}"
      retreat_pose: home
      speed_percent: 25.0
      gripper_speed_percent: 40.0
      retries: 1

    # ============ PIEZA 2: ArUco 1 -> base de montaje ===========

    - type: navigate
      name: ir_a_estacion_1
      pose: estacion_1
      frame_id: map
      retries: 2

    - type: grasp
      name: tomar_pieza_1
      action: pick
      object: "${pieza_1}"
      retreat_pose: carry
      speed_percent: 25.0
      gripper_speed_percent: 40.0
      retries: 1

    - type: navigate
      name: ir_a_montaje_1
      pose: montaje
      frame_id: map
      retries: 2

    - type: grasp
      name: apilar_pieza_1
      action: place
      object: "${pieza_1}"
      retreat_pose: home
      speed_percent: 25.0
      gripper_speed_percent: 40.0
      retries: 1

    # ============ PIEZA 3: ArUco 2 -> base de montaje ===========

    - type: navigate
      name: ir_a_estacion_2
      pose: estacion_2
      frame_id: map
      retries: 2

    - type: grasp
      name: tomar_pieza_2
      action: pick
      object: "${pieza_2}"
      retreat_pose: carry
      speed_percent: 25.0
      gripper_speed_percent: 40.0
      retries: 1

    - type: navigate
      name: ir_a_montaje_2
      pose: montaje
      frame_id: map
      retries: 2

    - type: grasp
      name: apilar_pieza_2
      action: place
      object: "${pieza_2}"
      retreat_pose: home
      speed_percent: 25.0
      gripper_speed_percent: 40.0
      retries: 1

    # ============================ FINISH ==============================

    - type: arm_pose
      name: plegar_brazo_final
      pose: home
      speed_percent: 30.0
      retries: 1

    - type: navigate
      name: estacionar_en_finish
      pose: finish
      frame_id: map
      retries: 2
