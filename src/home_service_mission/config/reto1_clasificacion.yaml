# =====================================================================
#  RETO 1 — ZONA DE CLASIFICACION  (KOSTAL)
#  Numeracion segun "Indicaciones tecnicas T-SUMMIT Challenge"
# ---------------------------------------------------------------------
#  Secuencia OBLIGATORIA:  START -> Verde 0 -> Verde 2 -> Azul 1 -> Azul 3 -> FINISH
#
#  LOS ArUco MARCAN UBICACIONES, NO PIEZAS
#  =======================================
#  Es lo unico que el reglamento fija, y hay que tenerlo claro porque
#  grasp_catalog.yaml tiene ADEMAS un `aruco_to_object` provisional
#  (1->engranaje, 2->poste, 3->rueda) que es otra cosa. Con
#  `object: auto`, en la entrega (ArUco 2) el robot creeria que hay un
#  poste. Por eso los pasos nombran la pieza explicitamente, via
#  variable.
#
#  QUE PIEZA HAY EN CADA SITIO NO SE SABE HASTA LA PISTA
#  ====================================================
#  Por eso van como variables y no como literales. Se sobrescriben sin
#  tocar el fichero:
#
#      ./scripts/tsummit.sh reto1 --pieza-verde poste --pieza-azul rueda
#
#  POSICIONES
#  ==========
#  Salen de <mapa>.poses.yaml, que escribe `tsummit.sh save-pose`
#  durante el mapeo. Aqui no hay ni una coordenada. Si falta alguna, la
#  mision NO arranca -- avisa antes de mover el robot, no a mitad de
#  rutina con una pieza en la pinza.
#
#  Posiciones necesarias (con estos nombres exactos):
#      start        el origen, area de START
#      carga_0      frente al ArUco 0 (recogida verde)
#      posicion_2   waypoint de paso hacia la zona de entrega
#      entrega_2    frente al ArUco 2 (entrega verde)
#      posicion_1   waypoint de paso hacia la zona de carga
#      carga_1      frente al ArUco 1 (recogida azul)
#      entrega_3    frente al ArUco 3 (entrega azul)
#      finish       area de FINISH
#
#  Los `navigate` solo tienen que dejar al robot CERCA y mirando al
#  marcador: el encare fino lo hace la aproximacion ArUco, que va DENTRO
#  del paso `grasp`. Por eso no hay pasos `aruco` sueltos: meterlos
#  haria la aproximacion dos veces.
#
#  ANTES DE CORRER ESTO
#  ====================
#  1) Mapa y posiciones guardadas.
#  2) Calibracion de pick Y de place para cada pieza, a la altura de
#     plataforma que se use:
#         ./scripts/tsummit.sh calibrate-grasp <pieza> 100 --action pick
#         ./scripts/tsummit.sh calibrate-grasp <pieza> 100 --action place
#     Sin la de place el paso de entrega aborta con INVALID_GOAL: el
#     servidor NO deduce el soltado a partir del agarre.
#  3) La pila preparada, con la MISMA altura de plataforma.
# =====================================================================

mission:

  name: reto1_clasificacion

  # Mapa al que se atan las posiciones. Explicito a proposito: vacio
  # cogeria el <mapa>.poses.yaml mas reciente, y cargar en silencio las
  # posiciones de otro mapa manda al robot a coordenadas que no existen.
  map: "maze-map"

  vars:
    # Pieza VERDE: se recoge en el ArUco 0 y se entrega en el 2.
    pieza_verde: "rueda"
    # Pieza AZUL: se recoge en el ArUco 1 y se entrega en el 3.
    pieza_azul: "estrella"

  repeat: 1

  # El reto penaliza los errores de secuencia. Si algo falla de verdad
  # es preferible parar a seguir colocando piezas donde no toca.
  stop_on_failure: true

  steps:

    - type: arm_pose
      name: plegar_brazo_para_navegar
      pose: home
      speed_percent: 30.0
      retries: 1

    # ================= PIEZA VERDE: ArUco 0 -> ArUco 2 ================

    - type: navigate
      name: ir_a_carga_verde
      pose: carga_0
      frame_id: map
      retries: 2

    - type: grasp
      name: tomar_pieza_verde
      # ArUco de la ESTACION, no de la pieza.
      aruco: 0
      action: pick
      object: "${pieza_verde}"
      retreat_pose: carry
      speed_percent: 25.0
      gripper_speed_percent: 40.0
      retries: 1

    - type: navigate
      name: cruzar_a_entrega
      pose: posicion_2
      frame_id: map
      retries: 2

    - type: navigate
      name: ir_a_entrega_verde
      pose: entrega_2
      frame_id: map
      retries: 2

    - type: grasp
      name: soltar_pieza_verde
      # ArUco de la ESTACION, no de la pieza.
      aruco: 2
      action: place
      object: "${pieza_verde}"
      retreat_pose: home
      speed_percent: 25.0
      gripper_speed_percent: 40.0
      retries: 1

    # ================= PIEZA AZUL: ArUco 1 -> ArUco 3 =================

    - type: navigate
      name: volver_a_zona_de_carga
      pose: posicion_1
      frame_id: map
      retries: 2

    - type: navigate
      name: ir_a_carga_azul
      pose: carga_1
      frame_id: map
      retries: 2

    - type: grasp
      name: tomar_pieza_azul
      # ArUco de la ESTACION, no de la pieza.
      aruco: 1
      action: pick
      object: "${pieza_azul}"
      retreat_pose: carry
      speed_percent: 25.0
      gripper_speed_percent: 40.0
      retries: 1

    - type: navigate
      name: cruzar_a_entrega_azul
      pose: posicion_2
      frame_id: map
      retries: 2

    - type: navigate
      name: ir_a_entrega_azul
      pose: entrega_3
      frame_id: map
      retries: 2

    - type: grasp
      name: soltar_pieza_azul
      # ArUco de la ESTACION, no de la pieza.
      aruco: 3
      action: place
      object: "${pieza_azul}"
      retreat_pose: home
      speed_percent: 25.0
      gripper_speed_percent: 40.0
      retries: 1

    # ============================ FINISH ==============================

    - type: arm_pose
      name: plegar_brazo_final
      pose: home
      speed_percent: 30.0
      retries: 1

    - type: navigate
      name: estacionar_en_finish
      pose: finish
      frame_id: map
      retries: 2
