mecharm_driver_node:
  ros__parameters:

    # ---------------------------------------------------------------
    # Conexion serie con el M5Stack del MechArm 270
    # ---------------------------------------------------------------
    port: "/dev/ttyACM0"
    baud: 115200

    # Si la conexion falla al arrancar, reintenta cada este intervalo.
    reconnect_period_sec: 3.0

    # ---------------------------------------------------------------
    # Velocidades (0..100)
    # ---------------------------------------------------------------
    default_speed_percent: 40.0
    max_speed_percent: 60.0
    default_gripper_speed_percent: 50.0

    # ---------------------------------------------------------------
    # Gripper
    # ---------------------------------------------------------------
    # Valores 0..100 (0 = cerrado, 100 = abierto) para el gripper
    # adaptativo. Ajusta segun tu pinza y pieza.
    gripper_open_value: 100
    gripper_closed_value: 20
    # Ajuste moderado de fuerza para la pinza adaptativa.
    gripper_torque: 500
    gripper_force_control: true
    # Limite de corriente del gripper (1..500).
    gripper_protect_current: 500
    # 1 = pinza adaptativa; se envia explicitamente por compatibilidad
    # con pymycobot, que en algunas versiones rechaza None.
    gripper_type: 1

    # ---------------------------------------------------------------
    # Tiempos
    # ---------------------------------------------------------------
    # Las rutas articulares ensenadas a 5-10% necesitan mas de 20 s.
    # stall_timeout_sec sigue cancelando si el brazo deja de progresar.
    move_timeout_sec: 45.0
    gripper_timeout_sec: 5.0
    settle_time_sec: 0.4
    # Tiempo extra tras mover la pinza para que asiente sobre la pieza.
    gripper_settle_sec: 0.6
    # Reaplica el cierre tras asentarse sobre la pieza.
    gripper_regrip_sec: 1.0
    # No eleva en vacio: el AG-320 debe quedar mas abierto que el cierre
    # solicitado para demostrar que encontro una pieza entre las mordazas.
    verify_grasp: true

    # ---------------------------------------------------------------
    # Criterio de llegada
    # ---------------------------------------------------------------
    # Se considera alcanzado el objetivo cuando la posicion REAL leida
    # del brazo entra en tolerancia, no cuando is_moving() dice 0
    # (esa lectura es intermitente y poco fiable por serie).
    # La telemetria de esta unidad fluctua algo mas de 2 deg al asentarse.
    angle_tolerance_deg: 3.5
    coord_tolerance_mm: 6.0
    arrival_stable_samples: 3
    max_read_failures: 25
    # Si el error deja de reducirse durante este tiempo se aborta:
    # obstruccion, limite articular o pose fuera del alcance de 270 mm.
    stall_timeout_sec: 20.0
    taught_stall_timeout_sec: 12.0
    taught_max_joint_step_deg: 0.0

    # ---------------------------------------------------------------
    # Limites articulares (grados) - MechArm 270 M5
    # Limites reportados por el firmware y aplicados por pymycobot.
    # ---------------------------------------------------------------
    joint_limits_min: [-160.0,  -75.0, -175.0, -155.0, -115.0, -180.0]
    joint_limits_max: [ 160.0,  120.0,   65.0,  155.0,  115.0,  180.0]

    # El firmware reproduce bien FK (angles_to_coords), pero su
    # solve_inv_kinematics devolvio [82.41] * 6 incluso para la pose
    # actual. Hasta corregir esa API, send_coords es la unica via IK
    # valida para objetivos cartesianos ensenados.
    coords_via_ik: false
    # Medido: send_coords deja Z ~11 mm por debajo de la coordenada leida.
    # Se compensa solo al mandar el comando; la llegada usa la pose ensenada.
    coords_command_z_offset_mm: 11.0
    # Reintenta una vez una pose cartesiana cercana sin aceptar el residuo.
    coords_retry_error_mm: 15.0

    # ---------------------------------------------------------------
    # Poses con nombre
    # ---------------------------------------------------------------
    # Ruta al YAML de poses. "" -> usa config/poses.yaml del paquete.
    poses_file: ""

    # ---------------------------------------------------------------
    # joint_states de depuracion
    # ---------------------------------------------------------------
    publish_joint_states: true
    joint_states_rate_hz: 5.0
    joint_names:
      - joint1_to_base
      - joint2_to_joint1
      - joint3_to_joint2
      - joint4_to_joint3
      - joint5_to_joint4
      - joint6_to_joint5
